<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OvisOCR</title><link rel="stylesheet" href="/static/style.css"></head><body><main><h1>OvisOCR</h1><p>Handwriting, documents, formulas, and tables to Markdown.</p><form id="form"><input id="file" type="file" accept="image/png,image/jpeg,image/webp" required><button>Run OCR</button></form><div class="result-head"><span id="status"></span><span id="elapsed"></span></div><div class="actions"><button id="copy" disabled>Copy Markdown</button><button id="download" disabled>Download .md</button></div><textarea id="output" readonly placeholder="OCR output will appear here"></textarea></main><script>const f=document.querySelector('#form'),i=document.querySelector('#file'),o=document.querySelector('#output'),s=document.querySelector('#status'),t=document.querySelector('#elapsed'),c=document.querySelector('#copy'),d=document.querySelector('#download');f.onsubmit=async e=>{e.preventDefault();s.textContent='Processing...';t.textContent='';o.value='';c.disabled=d.disabled=true;const b=new FormData();b.append('file',i.files[0]);try{const r=await fetch('/api/ocr',{method:'POST',body:b}),x=await r.json();if(!r.ok)throw Error(x.detail||'Request failed');o.value=x.markdown;s.textContent='Complete';t.textContent=`OCR time: ${x.elapsed_seconds.toFixed(3)} s`;c.disabled=d.disabled=false}catch(e){s.textContent=e.message}};c.onclick=()=>navigator.clipboard.writeText(o.value);d.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([o.value],{type:'text/markdown'}));a.download='ocr-output.md';a.click()};</script></body></html>
