<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OvisOCR</title><link rel="stylesheet" href="/static/style.css"></head><body><main><h1>OvisOCR</h1><p>Images, PDFs, and multi-page TIFFs to Markdown.</p><form id="form"><label for="model">Model</label><select id="model"><option value="ovisocr2" selected>OvisOCR2-F16</option><option value="teleocr">TeleOCR (NaviDC-OCR)</option></select><input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/tiff,application/pdf" required><button type="submit">Run OCR</button></form><div class="result-head"><span id="status"></span><span id="elapsed"></span></div><div class="actions"><button id="copy" type="button" disabled>Copy Markdown</button><button id="save" type="button" disabled>Save Markdown</button></div><textarea id="output" readonly placeholder="OCR output will appear here"></textarea></main><script>const f=document.querySelector('#form'),i=document.querySelector('#file'),o=document.querySelector('#output'),s=document.querySelector('#status'),t=document.querySelector('#elapsed'),c=document.querySelector('#copy'),d=document.querySelector('#save'),m=document.querySelector('#model');function save(){const name=(i.files[0]?.name||'ocr-output').replace(/\.[^.]+$/,'')+'.md',a=document.createElement('a');a.href=URL.createObjectURL(new Blob([o.value],{type:'text/markdown;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}f.onsubmit=async e=>{e.preventDefault();s.textContent='Processing...';t.textContent='';o.value='';c.disabled=d.disabled=true;const b=new FormData();b.append('file',i.files[0]);b.append('model',m.value);try{const r=await fetch('/api/ocr',{method:'POST',body:b}),x=await r.json();if(!r.ok)throw Error(x.detail||'Request failed');o.value=x.markdown;s.textContent=`Complete (${x.page_count} page${x.page_count==1?'':'s'}) — ${x.model}`;t.textContent=`OCR time: ${x.elapsed_seconds.toFixed(3)} s`;c.disabled=d.disabled=false}catch(e){s.textContent=e.message}};c.onclick=()=>navigator.clipboard.writeText(o.value);d.onclick=save;</script></body></html>
